name: Materialize tracked source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore tracked source archive
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.github/home-care-records.tar.xz.b64.part-*)
          if [ "${#parts[@]}" -lt 13 ]; then
            echo "Archive parts are not all present yet; skipping."
            exit 0
          fi
          cat "${parts[@]}" | base64 -d > /tmp/home-care-records.tar.xz
          tar -xJf /tmp/home-care-records.tar.xz -C "$GITHUB_WORKSPACE"
          rm -f "${parts[@]}" .github/workflows/materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add home care records app"
          git push
