name: Materialize tracked source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore tracked source archive
        run: |
          set -euo pipefail
          part_a=".github/home-care-records.tar.gz.b64.part-aa"
          part_b=".github/home-care-records.tar.gz.b64.part-ab"
          if [ ! -f "$part_a" ] || [ ! -f "$part_b" ]; then
            echo "Archive parts are not both present yet; skipping."
            exit 0
          fi
          cat "$part_a" "$part_b" | base64 -d > /tmp/home-care-records.tar.gz
          tar -xzf /tmp/home-care-records.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f "$part_a" "$part_b" .github/workflows/materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add home care records app"
          git push
