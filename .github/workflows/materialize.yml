name: Materialize tracked source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore tracked source archive
        run: |
          set -euo pipefail
          archive_url="https://thee-firefox-headquarters-suggest.trycloudflare.com/home-care-records.tar.xz"
          archive_sha="5a0e988eca1afc7f98a7b4667b3b4360de79200c7270d4a01dec3e6a3da43628"
          archive_path="/tmp/home-care-records.tar.xz"
          curl -L --fail --retry 5 --retry-delay 2 -o "$archive_path" "$archive_url"
          echo "$archive_sha  $archive_path" | sha256sum -c -
          tar -xJf "$archive_path" -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/materialize.yml .github/home-care-records.tar.*.part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: add home care records app"
          git push
